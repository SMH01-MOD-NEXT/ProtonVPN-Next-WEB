<!doctype html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title data-t="meta_title">Proton VPN-Next</title>
		<meta name="description" data-t-content="meta_description" content="" />
		<meta name="theme-color" content="#0C0C14" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="/assets/icon.png" />
		<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
		<meta property="og:type" content="website" />
		<meta property="og:title" data-t-content="meta_title" content="" />
		<meta
			property="og:description"
			data-t-content="meta_description"
			content=""
		/>
		<meta property="og:image" content="/assets/icon-1024.png" />
		<link rel="preconnect" href="https://r2.protonnext.qzz.io" />
	</head>
	<body class="lang-en">
		<a
			href="#features"
			class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-brand focus:px-4 focus:py-2 focus:text-white"
			data-t="nav_skip"
		></a>

		<header
			class="sticky top-0 z-40 border-b border-white/10 bg-ink/80 backdrop-blur"
		>
			<div class="container-page flex h-16 items-center gap-4">
				<a href="#top" class="flex items-center gap-2.5">
					<img
						src="/assets/icon.png"
						alt="Proton VPN-Next"
						width="32"
						height="32"
						class="h-8 w-8 rounded-lg"
					/>
					<span class="text-sm font-semibold text-white">VPN-Next</span>
				</a>

				<nav class="ms-auto hidden items-center gap-1 md:flex">
					<a
						href="#features"
						class="rounded-lg px-3 py-2 text-sm text-slate-300 hover:bg-white/5 hover:text-white"
						data-t="nav_features"
					></a>
					<a
						href="#downloads"
						class="rounded-lg px-3 py-2 text-sm text-slate-300 hover:bg-white/5 hover:text-white"
						data-t="nav_download"
					></a>
					<a
						href="#generator"
						class="rounded-lg px-3 py-2 text-sm text-slate-300 hover:bg-white/5 hover:text-white"
						data-t="nav_generator"
					></a>
					<a
						href="#about"
						class="rounded-lg px-3 py-2 text-sm text-slate-300 hover:bg-white/5 hover:text-white"
						data-t="nav_about"
					></a>
				</nav>

				<label class="ms-auto md:ms-0">
					<span class="sr-only" data-t="nav_language"></span>
					<select
						id="lang-select"
						class="field w-auto py-2"
						data-t-aria-label="nav_language"
					></select>
				</label>
			</div>
		</header>

		<main id="top">
			<!-- Hero -->
			<section class="container-page pt-16 pb-10 sm:pt-24">
				<div class="grid items-center gap-12 lg:grid-cols-[1.15fr_1fr]">
					<div>
						<span class="badge" data-t="hero_badge"></span>
						<h1
							class="mt-5 text-4xl font-semibold tracking-tight text-white sm:text-6xl"
							data-t="hero_title"
						></h1>
						<p
							class="mt-5 max-w-xl text-lg text-slate-400"
							data-t="hero_subtitle"
						></p>

						<div class="mt-8 flex flex-wrap gap-3">
							<a
								href="#downloads"
								class="btn-primary"
								data-t="hero_cta_download"
							></a>
							<a
								href="#generator"
								class="btn-ghost"
								data-t="hero_cta_generator"
							></a>
							<!--
								Two homes for the same code, so the icons carry the name
								in their label rather than a shared "source code" caption:
								GitLab is where development happens, GitHub is a mirror.
							-->
							<a
								href="https://gitlab.com/vpn-next-group/proton-vpn-next"
								rel="noopener noreferrer"
								target="_blank"
								class="btn-ghost icon-link"
								data-t-aria-label="link_gitlab"
								data-t-title="link_gitlab"
							>
								<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
									<path d="M22.65 14.39 12 22.13 1.35 14.39a.84.84 0 0 1-.3-.94l1.22-3.78 2.44-7.51A.42.42 0 0 1 5.12 2a.43.43 0 0 1 .58.28l2.44 7.49h7.72l2.44-7.49a.42.42 0 0 1 .41-.28.43.43 0 0 1 .58.28l2.44 7.51L23 13.45a.84.84 0 0 1-.35-.94Z" />
								</svg>
							</a>
							<a
								href="https://github.com/SMH01-MOD-NEXT/ProtonVPN-Next"
								rel="noopener noreferrer"
								target="_blank"
								class="btn-ghost icon-link"
								data-t-aria-label="link_github"
								data-t-title="link_github"
							>
								<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
									<path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.55v-2.15c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7 0 .7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.8 1.18 1.83 1.18 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14v3.17c0 .3.21.66.8.55A11.5 11.5 0 0 0 12 .5Z" />
								</svg>
							</a>
						</div>

						<dl class="mt-10 grid max-w-md grid-cols-3 gap-4">
							<div class="card flex h-full flex-col p-4">
								<dt
									class="text-xs text-slate-400"
									data-t="hero_stat_channels"
								></dt>
								<dd class="mt-auto pt-2 text-2xl font-semibold text-white">2</dd>
							</div>
							<div class="card flex h-full flex-col p-4">
								<dt
									class="text-xs text-slate-400"
									data-t="hero_stat_flavors"
								></dt>
								<dd class="mt-auto pt-2 text-2xl font-semibold text-white">8</dd>
							</div>
							<div class="card flex h-full flex-col p-4">
								<dt
									class="text-xs text-slate-400"
									data-t="hero_stat_languages"
								></dt>
								<dd class="mt-auto pt-2 text-2xl font-semibold text-white">7</dd>
							</div>
						</dl>
					</div>

					<div class="relative hidden lg:block">
						<div
							class="absolute inset-0 -z-10 rounded-full bg-brand/25 blur-3xl"
						></div>
						<img
							src="/assets/icon.png"
							alt=""
							width="420"
							height="420"
							class="mx-auto w-72 rounded-[2.5rem] shadow-2xl shadow-brand/30"
						/>
					</div>
				</div>
			</section>

			<!-- Features -->
			<section id="features" class="section">
				<div class="container-page">
					<h2 class="section-title" data-t="features_title"></h2>
					<p class="section-subtitle" data-t="features_subtitle"></p>

					<div class="mt-10 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
						<article class="card">
							<h3
								class="text-base font-semibold text-white"
								data-t="feat_1_title"
							></h3>
							<p class="mt-2 text-sm text-slate-400" data-t="feat_1_desc"></p>
						</article>
						<article class="card">
							<h3
								class="text-base font-semibold text-white"
								data-t="feat_2_title"
							></h3>
							<p class="mt-2 text-sm text-slate-400" data-t="feat_2_desc"></p>
						</article>
						<article class="card">
							<h3
								class="text-base font-semibold text-white"
								data-t="feat_3_title"
							></h3>
							<p class="mt-2 text-sm text-slate-400" data-t="feat_3_desc"></p>
						</article>
						<article class="card">
							<h3
								class="text-base font-semibold text-white"
								data-t="feat_4_title"
							></h3>
							<p class="mt-2 text-sm text-slate-400" data-t="feat_4_desc"></p>
						</article>
						<article class="card">
							<h3
								class="text-base font-semibold text-white"
								data-t="feat_5_title"
							></h3>
							<p class="mt-2 text-sm text-slate-400" data-t="feat_5_desc"></p>
						</article>
						<article class="card">
							<h3
								class="text-base font-semibold text-white"
								data-t="feat_6_title"
							></h3>
							<p class="mt-2 text-sm text-slate-400" data-t="feat_6_desc"></p>
						</article>
					</div>
				</div>
			</section>

			<!-- Downloads -->
			<section id="downloads" class="section">
				<div class="container-page">
					<h2 class="section-title" data-t="dl_title"></h2>
					<p class="section-subtitle" data-t="dl_subtitle"></p>
					<!-- The per-platform hint is rendered by the downloads module. -->
					<div id="downloads-root" class="mt-10"></div>
				</div>
			</section>

			<!-- Config generator -->
			<section id="generator" class="section">
				<div class="container-page">
					<h2 class="section-title" data-t="gen_title"></h2>
					<p class="section-subtitle" data-t="gen_subtitle"></p>
					<div id="generator-root" class="mt-10"></div>
				</div>
			</section>

			<!-- About -->
			<section id="about" class="section">
				<div class="container-page grid gap-5 lg:grid-cols-2">
					<div class="card">
						<h2 class="section-title text-2xl" data-t="about_title"></h2>
						<p class="mt-3 text-sm text-slate-400" data-t="about_desc"></p>
					</div>
					<div class="card border-brand-light/30 bg-brand/10">
						<h2
							class="text-sm font-semibold uppercase tracking-wide text-brand-light"
							data-t="disclaimer_note"
						></h2>
						<p
							class="mt-3 text-sm text-slate-300"
							data-t="disclaimer_text"
						></p>
					</div>
				</div>
			</section>
		</main>

		<footer class="border-t border-white/10 py-10">
			<div
				class="container-page flex flex-col items-center gap-4 sm:flex-row sm:justify-between"
			>
				<nav class="flex flex-wrap items-center justify-center gap-4 text-sm">
					<a
						href="https://gitlab.com/vpn-next-group/proton-vpn-next"
						rel="noopener noreferrer"
						target="_blank"
						class="icon-link text-slate-400 hover:text-white"
						data-t-aria-label="link_gitlab"
						data-t-title="link_gitlab"
					>
						<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
							<path d="M22.65 14.39 12 22.13 1.35 14.39a.84.84 0 0 1-.3-.94l1.22-3.78 2.44-7.51A.42.42 0 0 1 5.12 2a.43.43 0 0 1 .58.28l2.44 7.49h7.72l2.44-7.49a.42.42 0 0 1 .41-.28.43.43 0 0 1 .58.28l2.44 7.51L23 13.45a.84.84 0 0 1-.35-.94Z" />
						</svg>
					</a>
					<a
						href="https://github.com/SMH01-MOD-NEXT/ProtonVPN-Next"
						rel="noopener noreferrer"
						target="_blank"
						class="icon-link text-slate-400 hover:text-white"
						data-t-aria-label="link_github"
						data-t-title="link_github"
					>
						<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
							<path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.55v-2.15c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7 0 .7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.8 1.18 1.83 1.18 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14v3.17c0 .3.21.66.8.55A11.5 11.5 0 0 0 12 .5Z" />
						</svg>
					</a>
					<a
						href="https://t.me/ProtonVPN_MOD"
						rel="noopener noreferrer"
						target="_blank"
						class="text-slate-400 hover:text-white"
						data-t="footer_telegram"
					></a>
					<a
						href="/lite/"
						class="text-slate-400 hover:text-white"
						data-t="footer_lite"
					></a>
				</nav>
				<p class="text-xs text-slate-500" data-t="footer_license"></p>
			</div>
		</footer>

		<script type="module" src="/src/main.js"></script>
	</body>
</html>
